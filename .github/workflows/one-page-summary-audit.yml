name: one-page-summary-audit
on:
  push:
    paths:
      - ".github/workflows/one-page-summary-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize-numbering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF editor
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Match nine numbered points to frozen HTML summary
        run: |
          python - <<'PY'
          import fitz, hashlib, json
          from pathlib import Path
          pdf=Path("reports/final/executive_summary.pdf")
          doc=fitz.open(pdf)
          assert len(doc)==1, f"expected one-page summary, got {len(doc)}"
          titles=[
              ("全量审计识别数据约束",1,"research"),
              ("多层诊断确认可观测差异",2,"research"),
              ("预设增量指标统一比较目标",3,"research"),
              ("重训分析量化选择敏感性",4,"research"),
              ("模型定向提高固定名额",1,"business"),
              ("收益接近与名单重合",2,"business"),
              ("一致的入选画像与分层增量",3,"business"),
              ("边际回报下降支持较低覆盖率",4,"business"),
              ("交付方案将离线结论",5,"business"),
          ]
          page=doc[0]
          seen=[]
          for title,idx,section in titles:
              positions=page.search_for(title)
              assert len(positions)==1, f"expected one match for {title}: {positions}"
              rect=positions[0]
              assert 39.0 < rect.x0 < 41.0, f"unexpected text indent: {rect}"
              assert 150.0 < rect.y0 < 760.0, f"unexpected vertical position: {rect}"
              stamp=f"{idx}."
              color=(0.10,0.34,0.46) if section=="research" else (0.20,0.36,0.29)
              baseline=rect.y1-0.6
              page.insert_text((25.5,baseline),stamp,fontname="hebo",fontsize=8.8,color=color,overlay=True)
              seen.append((stamp,section,round(rect.y0,2)))
          output=pdf.with_name("executive_summary_new.pdf")
          doc.save(output,garbage=4,deflate=True)
          doc.close()
          check=fitz.open(output)
          assert len(check)==1
          assert all(check[0].search_for(t) for t,_,_ in titles)
          for label,section,y in seen:
              print(f"added {section} {label} at paragraph y={y}")
          check.close()
          output.replace(pdf)
          fingerprint=hashlib.sha256(pdf.read_bytes()).hexdigest()
          provenance_path=Path("reports/final/report_provenance.json")
          provenance=json.loads(provenance_path.read_text(encoding="utf-8"))
          provenance["executive_summary_sha256"]=fingerprint
          provenance_path.write_text(json.dumps(provenance,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("updated one-page summary PDF SHA-256", fingerprint)
          PY
      - name: Commit synchronized summary PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/final/executive_summary.pdf reports/final/report_provenance.json
          git diff --cached --check
          git commit -m "Synchronize PDF summary numbering with Report v2"
          git push origin HEAD:main
