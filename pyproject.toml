[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "criteo-uplift-project"
version = "0.1.0"
description = "Budget-constrained incremental conversion evaluation on a public randomized benchmark"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2", "xgboost>=2.0,<4",
  "statsmodels>=0.14,<1",
  "matplotlib>=3.8,<4", "joblib>=1.3,<2", "threadpoolctl>=3.2,<4"
]

[tool.setuptools.packages.find]
include = ["criteo_uplift*"]
exclude = ["tests*", "artifacts*", "reports*", "data*"]
